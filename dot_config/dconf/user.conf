# GNOME dconf settings
# Regenerate from a running system with:
#   dconf dump /org/gnome/desktop/ > desktop.tmp
#   dconf dump /org/gnome/shell/ > shell.tmp
#   dconf dump /org/gnome/mutter/ > mutter.tmp
#   dconf dump /org/gnome/settings-daemon/ > settings-daemon.tmp
# Then merge into this file.
# Apply with: dconf load / < ~/.config/dconf/user.conf

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Adwaita-dark'
monospace-font-name='JetBrainsMono Nerd Font 11'
clock-show-weekday=true
clock-show-seconds=false

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true
natural-scroll=true
two-finger-scrolling-enabled=true

[org/gnome/desktop/wm/keybindings]
close=['<Super>q']
toggle-fullscreen=['<Super>f']

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/mutter]
edge-tiling=true
dynamic-workspaces=true

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-temperature=uint32 3500
night-light-schedule-automatic=true

[org/gnome/shell]
favorite-apps=['org.gnome.Nautilus.desktop', 'com.mitchellh.ghostty.desktop', 'io.gitlab.librewolf-community.desktop']

[org/gnome/desktop/input-sources]
xkb-options=['caps:escape']
